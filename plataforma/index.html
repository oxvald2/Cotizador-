<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Laios · Plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{--teal:#132f33;--teal-soft:#1d4147;--gold:#dda11b;--ink:#132f33;--paper:#fbfaf6;--gray:#5b5648;--gray-2:#6f6a5b;--line:#e6e2d7;--line-2:#cfcabd;--ok:#2e7d32;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Archivo',system-ui,sans-serif;background:#cdc8bb;color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:680px;margin:0 auto;}
  input,button,select{font-family:inherit;color:var(--ink);}
  .hide{display:none!important;}
  svg{width:20px;height:20px;flex-shrink:0;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none;}

  /* LOGIN */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--teal);}
  .login-card{background:var(--paper);border-radius:16px;padding:30px 26px;width:100%;max-width:380px;}
  .login-card .brand{font-family:'Anton';font-size:30px;text-transform:uppercase;letter-spacing:.03em;}
  .login-card .brand .g{color:var(--gold);}
  .login-card .tag{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:4px 0 22px;}
  .login-card label{display:block;font-family:'Archivo';font-weight:600;font-size:14px;margin:14px 0 5px;}
  .login-card input{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:12px;font-size:15px;outline:none;}
  .login-card input:focus{border-color:var(--gold);}
  .pass-wrap{position:relative;} .pass-wrap input{padding-right:44px;}
  .pass-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:16px;cursor:pointer;opacity:.7;}
  .lbtn{width:100%;background:var(--gold);color:var(--teal);border:none;border-radius:999px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;margin-top:20px;}
  #login-msg{text-align:center;font-family:'IBM Plex Mono';font-size:12px;color:#b23b3b;margin-top:12px;min-height:16px;}

  /* TOPBAR */
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;}
  .burger{background:none;border:none;cursor:pointer;padding:2px;color:var(--teal);display:flex;}
  .burger svg{stroke:var(--teal);}
  .topbar .brand{font-family:'Anton';font-size:17px;text-transform:uppercase;flex:1;letter-spacing:.02em;} .topbar .brand .g{color:var(--gold);}
  .topbar .pagettl{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-2);}

  /* DRAWER */
  .drawer{position:fixed;top:0;bottom:0;left:0;width:270px;max-width:82vw;background:#fff;z-index:60;transform:translateX(-100%);transition:transform .25s;box-shadow:8px 0 30px -10px rgba(0,0,0,.3);display:flex;flex-direction:column;padding:18px 0 10px;}
  .drawer.open{transform:translateX(0);}
  .drawer-ov{position:fixed;inset:0;background:rgba(19,47,51,.45);z-index:55;opacity:0;pointer-events:none;transition:.25s;}
  .drawer-ov.open{opacity:1;pointer-events:auto;}
  .dr-brand{font-family:'Anton';font-size:22px;text-transform:uppercase;padding:4px 22px 16px;letter-spacing:.03em;} .dr-brand .g{color:var(--gold);}
  .dr-menu{flex:1;padding:10px 12px;overflow-y:auto;}
  .dr-lbl{font-family:'IBM Plex Mono';font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-2);padding:10px 10px 5px;}
  .dr-item{display:flex;align-items:center;gap:13px;padding:12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:15px;color:var(--teal);}
  .dr-item svg{stroke:var(--teal);}
  .dr-item.active{background:var(--teal);color:#fff;} .dr-item.active svg{stroke:#fff;}
  .dr-foot{border-top:1px solid var(--line);padding:12px 14px 4px;}
  .dr-user{display:flex;align-items:center;gap:11px;padding:6px;}
  .dr-user .av{width:36px;height:36px;border-radius:50%;background:var(--teal-soft);color:var(--gold);display:grid;place-items:center;font-family:'Anton';font-size:15px;}
  .dr-user .n{font-weight:700;font-size:14px;} .dr-user .s{font-family:'IBM Plex Mono';font-size:10px;color:var(--gray-2);}

  .view{padding:16px 14px 40px;}
  .h1{font-family:'Anton';font-size:24px;text-transform:uppercase;}
  .h1-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .newbtn{background:var(--gold);color:var(--teal);border:none;border-radius:999px;padding:9px 15px;font-family:'IBM Plex Mono';font-weight:600;font-size:12px;cursor:pointer;}

  /* DASHBOARD */
  .segs{display:flex;gap:5px;background:#eae6da;border-radius:99px;padding:3px;margin-bottom:14px;}
  .segs button{flex:1;font-family:'IBM Plex Mono';font-size:10.5px;font-weight:600;border:none;background:transparent;color:var(--gray-2);padding:8px;border-radius:99px;cursor:pointer;}
  .segs button.active{background:var(--teal);color:#fff;}
  .kpi-hero{background:var(--teal);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px;}
  .kpi-hero .l{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);}
  .kpi-hero .v{font-family:'Anton';font-size:32px;line-height:1;margin:5px 0 3px;}
  .kpi-hero .usd{font-family:'IBM Plex Mono';font-size:10px;color:rgba(255,255,255,.6);}
  .kpi2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;}
  .kpi .l{font-family:'IBM Plex Mono';font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-2);}
  .kpi .v{font-family:'Anton';font-size:19px;margin-top:3px;}
  .kpi .c{font-family:'IBM Plex Mono';font-size:9.5px;color:var(--gray-2);}
  .chart{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 14px 4px;margin-bottom:14px;}
  .chart .t{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-2);margin-bottom:14px;}
  .bars{display:flex;align-items:flex-end;gap:8px;height:110px;}
  .bars .bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bars .bar{width:100%;background:var(--teal);border-radius:5px 5px 0 0;min-height:2px;}
  .bars .bar.gold{background:var(--gold);}
  .bars .bl{font-family:'IBM Plex Mono';font-size:8px;color:var(--gray-2);margin-top:5px;}
  .sec-h{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-2);margin:6px 2px 10px;}
  .rrow{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;}
  .badge{font-family:'IBM Plex Mono';font-size:8px;font-weight:600;text-transform:uppercase;padding:3px 7px;border-radius:99px;flex-shrink:0;}
  .badge.planos{background:#e7eef0;color:var(--teal);} .badge.remod{background:#fbf0d6;color:#8a6a12;}
  .rrow .m{flex:1;min-width:0;} .rrow .m .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rrow .m .s{font-family:'IBM Plex Mono';font-size:10px;color:var(--gray-2);}
  .rrow .amt{font-family:'IBM Plex Mono';font-weight:600;font-size:13px;white-space:nowrap;}
  .empty{text-align:center;font-family:'IBM Plex Mono';font-size:12px;color:var(--gray-2);padding:30px 20px;}

  /* CLIENTES */
  .cli{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px;cursor:pointer;}
  .cli .av{width:38px;height:38px;border-radius:50%;background:var(--teal-soft);color:var(--gold);display:grid;place-items:center;font-family:'Anton';font-size:16px;flex-shrink:0;}
  .cli .m{flex:1;min-width:0;} .cli .m .n{font-weight:600;font-size:14px;} .cli .m .s{font-family:'IBM Plex Mono';font-size:10px;color:var(--gray-2);}
  .cli-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .cli-card .field{margin-bottom:10px;}
  .cli-card label{display:block;font-family:'IBM Plex Mono';font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-2);margin-bottom:4px;}
  .cli-card input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;outline:none;background:#fff;}
  .cli-card input:focus{border-color:var(--gold);}
  .cli-title{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
  .save-cli{width:100%;background:var(--teal);color:#fff;border:none;border-radius:10px;padding:12px;font-family:'IBM Plex Mono';font-weight:600;font-size:13px;cursor:pointer;margin-top:4px;}

  /* COTIZAR */
  .cot-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
  .cot-card{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;box-shadow:0 6px 18px -14px rgba(19,47,51,.5);}
  .cot-card .ic{width:50px;height:50px;border-radius:12px;background:var(--teal);display:grid;place-items:center;flex-shrink:0;}
  .cot-card .ic svg{stroke:var(--gold);width:24px;height:24px;}
  .cot-card.rem .ic{background:var(--gold);} .cot-card.rem .ic svg{stroke:var(--teal);}
  .cot-card .t .n{font-family:'Archivo';font-weight:700;font-size:17px;} .cot-card .t .d{font-family:'IBM Plex Mono';font-size:11px;color:var(--gray-2);margin-top:2px;}
  .cot-card.soon{opacity:.62;} .cot-card.soon .ic{background:var(--line-2);} .cot-card.soon .ic svg{stroke:var(--gray-2);}
  .soon-tag{font-family:'IBM Plex Mono';font-size:8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:#eae6da;color:var(--gray-2);padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle;}

  /* EMBED */
  #embed{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:#cdc8bb;}
  .embed-bar{background:var(--teal);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;}
  .embed-bar button{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;padding:7px 12px;font-family:'IBM Plex Mono';font-size:12px;font-weight:600;cursor:pointer;}
  .embed-bar .t{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);}
  #embed iframe{flex:1;border:none;width:100%;}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--teal);color:#fff;font-family:'IBM Plex Mono';font-size:12px;padding:10px 18px;border-radius:99px;z-index:120;opacity:0;transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;} .toast.err{background:#8a2b2b;}
  /* ===== REMOD EDITOR (fusionado) ===== */
  #remod-screen{position:fixed;inset:0;z-index:90;background:#cdc8bb;display:flex;flex-direction:column;}
  .rm-bar{background:var(--teal);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;}
  .rm-bar button{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;padding:7px 12px;font-family:'IBM Plex Mono';font-size:12px;font-weight:600;cursor:pointer;}
  .rm-bar .t{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);flex:1;}
  #rm-editor{flex:1;overflow-y:auto;padding:14px 12px 96px;max-width:640px;margin:0 auto;width:100%;}
  .ed-meta{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;}
  .ed-meta label{display:block;font-family:'IBM Plex Mono';font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-2);margin:8px 0 4px;}
  .ed-meta label:first-child{margin-top:0;}
  .ed-meta input,.ed-meta select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;outline:none;background:#fff;}
  .ed-meta input:focus,.ed-meta select:focus{border-color:var(--gold);}
  .espacio{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 11px 14px;margin-bottom:14px;box-shadow:0 6px 18px -12px rgba(19,47,51,.4);}
  .esp-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .esp-icon{width:26px;height:26px;border-radius:7px;background:var(--teal);color:var(--gold);display:grid;place-items:center;font-size:13px;flex-shrink:0;}
  .esp-name{flex:1;font-family:'Anton';font-size:18px;color:var(--ink);border:none;background:transparent;outline:none;padding:2px 0;}
  .esp-name:focus{border-bottom:2px solid var(--gold);}
  .x-btn{background:none;border:none;color:var(--line-2);font-size:14px;font-weight:700;cursor:pointer;padding:4px 6px;}
  .partida{background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:9px 10px;margin-bottom:10px;}
  .part-head{display:flex;align-items:center;gap:6px;}
  .part-name{flex:1;font-family:'Archivo';font-weight:700;font-size:14.5px;color:var(--ink);border:none;outline:none;background:transparent;padding:1px 0;}
  .part-name:focus{border-bottom:1px solid var(--gold);}
  .part-name::placeholder{color:var(--line-2);}
  .part-desc{width:100%;border:1px solid var(--line);border-radius:7px;background:#fbfaf6;padding:6px 8px;font-family:'IBM Plex Mono';font-size:11px;color:var(--ink);outline:none;resize:vertical;min-height:34px;margin:6px 0 4px;}
  .part-desc:focus{border-color:var(--gold);background:#fff;}
  .pd-lbl{font-family:'IBM Plex Mono';font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-2);margin-top:6px;}
  .acapite{margin:8px 0 0 2px;padding:6px 0 5px 9px;border-left:2px solid var(--line-2);}
  .acap-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .acap-name{flex:1;font-family:'IBM Plex Mono';font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);border:none;background:transparent;outline:none;}
  .acap-name:focus{color:var(--ink);border-bottom:1px solid var(--gold);}
  .acap-name::placeholder{color:var(--line-2);}
  .linea{background:#f7f5ee;border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-bottom:6px;}
  .it-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .it-top .concepto{flex:1;border:none;outline:none;background:transparent;font-family:'Archivo';font-weight:600;font-size:12.5px;color:var(--ink);padding:1px 0;border-bottom:1px solid transparent;}
  .it-top .concepto:focus{border-bottom-color:var(--gold);}
  .it-top .concepto::placeholder{color:var(--line-2);font-weight:500;}
  .it-mode{display:flex;background:#eae6da;border-radius:99px;padding:2px;flex-shrink:0;}
  .it-mode button{font-family:'IBM Plex Mono';font-size:8.5px;font-weight:600;border:none;background:transparent;color:var(--gray-2);padding:3px 8px;border-radius:99px;cursor:pointer;}
  .it-mode button.active{background:var(--gold);color:var(--teal);}
  .nums{display:flex;align-items:flex-end;gap:5px;}
  .nb{display:flex;flex-direction:column;}
  .nb.qty{width:44px;} .nb.cost{width:70px;} .nb.pa{width:120px;}
  .nb small,.ub small,.subb small{font-family:'IBM Plex Mono';font-size:7px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-2);margin-bottom:2px;}
  .nb input{width:100%;border:1px solid var(--line);border-radius:5px;padding:5px;font-family:'IBM Plex Mono';font-size:12px;text-align:right;outline:none;background:#fff;}
  .nb input:focus{border-color:var(--gold);}
  .ub select{border:1px solid var(--line);border-radius:5px;padding:5px 1px;font-family:'IBM Plex Mono';font-size:10.5px;outline:none;background:#fff;}
  .times{font-family:'IBM Plex Mono';color:var(--gray-2);font-size:11px;padding-bottom:6px;}
  .subb{flex:1;text-align:right;} .subb b{font-family:'IBM Plex Mono';font-size:12.5px;color:var(--ink);}
  .lx{background:none;border:none;color:var(--line-2);font-size:12px;font-weight:700;cursor:pointer;padding-bottom:5px;}
  .mini-btn{border:none;background:transparent;color:var(--gold);font-family:'IBM Plex Mono';font-size:10px;font-weight:600;cursor:pointer;padding:4px 0;}
  .acap-foot{display:flex;justify-content:space-between;align-items:center;padding-top:2px;}
  .acap-sub{font-family:'IBM Plex Mono';font-size:11px;color:var(--gray-2);} .acap-sub b{color:var(--ink);}
  .part-sub{text-align:right;font-family:'IBM Plex Mono';font-size:11.5px;color:var(--gray-2);margin-top:5px;padding-top:6px;border-top:1px dashed var(--line);} .part-sub b{color:var(--ink);font-size:13px;}
  .esp-sub{text-align:right;font-family:'IBM Plex Mono';font-size:12px;color:var(--gray-2);margin-top:9px;} .esp-sub b{color:var(--ink);font-size:14px;}
  .add-row{width:100%;border:1px dashed var(--line-2);background:transparent;color:var(--gray);font-family:'IBM Plex Mono';font-size:11px;font-weight:600;padding:8px;border-radius:9px;cursor:pointer;margin-top:2px;}
  .add-row:hover{border-color:var(--gold);color:var(--gold);}
  .add-esp{width:100%;background:var(--teal);color:#fff;border:none;border-radius:12px;padding:13px;font-family:'IBM Plex Mono';font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px;}
  .add-esp .g{color:var(--gold);}
  .opt-card{background:var(--paper);border:1px solid var(--gold);border-radius:14px;padding:13px 14px;margin-bottom:14px;}
  .opt-h{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .seg{display:flex;background:#eef1ea;border-radius:99px;padding:2px;margin-bottom:10px;width:180px;}
  .seg button{flex:1;font-family:'IBM Plex Mono';font-size:10px;font-weight:600;border:none;background:transparent;color:var(--gray-2);padding:5px;border-radius:99px;cursor:pointer;}
  .seg button.active{background:var(--gold);color:var(--teal);}
  .opt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .opt-in{display:flex;align-items:center;gap:8px;}
  .opt-in input{width:90px;border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-family:'IBM Plex Mono';font-size:13px;text-align:right;outline:none;background:#fff;}
  .opt-in .u{font-family:'IBM Plex Mono';font-size:12px;color:var(--gray-2);}
  .opt-amt{font-family:'IBM Plex Mono';font-weight:600;font-size:14px;}
  .switch{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono';font-size:12px;color:var(--ink);cursor:pointer;}
  .switch input{width:40px;height:22px;-webkit-appearance:none;appearance:none;background:var(--line-2);border-radius:99px;position:relative;outline:none;cursor:pointer;transition:.2s;}
  .switch input:checked{background:var(--gold);}
  .switch input::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked::after{left:20px;}
  #rm-savebar{position:fixed;bottom:0;left:0;right:0;background:var(--teal);color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -12px rgba(0,0,0,.5);z-index:95;}
  .sb-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;}
  .sb-total{flex:1;} .sb-total .l{font-family:'IBM Plex Mono';font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);}
  .sb-total .v{font-family:'Anton';font-size:22px;line-height:1;margin-top:1px;}
  .sb-acts{display:flex;gap:7px;}
  .sb-acts button{border:none;border-radius:999px;font-family:'IBM Plex Mono';font-size:11px;font-weight:600;padding:10px 13px;cursor:pointer;}
  .b-prev{background:rgba(255,255,255,.14);color:#fff;} .b-save{background:var(--gold);color:var(--teal);}
  #rm-preview{position:fixed;inset:0;background:rgba(19,47,51,.6);z-index:100;display:flex;flex-direction:column;}
  .pv-bar{background:var(--teal);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;}
  .pv-tabs{display:flex;gap:4px;flex:1;}

  .pv-tabs button.active{color:#fff;border-bottom-color:var(--gold);}

  .in-item{display:flex;justify-content:space-between;font-family:'IBM Plex Mono';font-size:11px;padding:2px 0;gap:8px;}
  .in-item .d{flex:1;} .in-item .q{color:var(--gray-2);white-space:nowrap;} .in-item .s{white-space:nowrap;font-weight:600;}
  .pa-tag{color:var(--gold);font-size:8px;font-weight:600;}
  .shop{margin-top:8px;} .shop-h{font-family:'Anton';font-size:15px;border-bottom:1px solid var(--ink);padding-bottom:3px;margin-bottom:6px;}

  .shop-item .d{flex:1;} .shop-item .b{color:var(--gray-2);font-size:9.5px;} .shop-item .s{white-space:nowrap;font-weight:600;}
</style>

<body>

<div id="login">
  <div class="login-card">
    <div class="brand"><span class="g">Laios</span> Group</div>
    <div class="tag">Plataforma de cotizaciones</div>
    <label for="login-email">Correo</label>
    <input id="login-email" type="email" autocomplete="username" placeholder="tu@correo.com">
    <label for="login-pass">Contraseña</label>
    <div class="pass-wrap"><input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••••"><button type="button" class="pass-toggle" id="toggle-pass">👁</button></div>
    <button class="lbtn" id="login-btn">Entrar</button>
    <div id="login-msg"></div>
  </div>
</div>

<div id="app" class="hide">
  <div class="topbar">
    <button class="burger" id="burger"></button>
    <div class="brand"><span class="g">Laios</span> Group</div>
    <div class="pagettl" id="pagettl">Dashboard</div>
  </div>

  <div class="drawer-ov" id="dr-ov"></div>
  <div class="drawer" id="drawer">
    <div class="dr-brand"><span class="g">Laios</span> Group</div>
    <div class="dr-menu">
      <div class="dr-lbl">Menú</div>
      <div class="dr-item active" data-nav="dash"></div>
      <div class="dr-item" data-nav="cli"></div>
      <div class="dr-item" data-nav="cot"></div>
      <div class="dr-lbl" style="margin-top:6px">Cuenta</div>
      <div class="dr-item" data-nav="ajustes"></div>
    </div>
    <div class="dr-foot"><div class="dr-user"><div class="av" id="dr-av">O</div><div><div class="n" id="dr-name">—</div><div class="s">Laios Group</div></div></div>
      <div class="dr-item" id="dr-logout" style="margin-top:4px"></div>
    </div>
  </div>

  <div class="wrap">
    <div class="view" id="v-dash"></div>
    <div class="view hide" id="v-cli"></div>
    <div class="view hide" id="v-cot"></div>
    <div class="view hide" id="v-ajustes"><div class="h1-row"><div class="h1">Ajustes</div></div><div class="empty">Aquí irán tarifas base, marca, usuarios del equipo y preferencias. (Próxima etapa.)</div></div>
  </div>
</div>

<div id="remod-screen" class="hide">
  <div class="rm-bar"><button id="rm-back">← Inicio</button><span class="t" id="rm-title">Remodelación</span></div>
  <div id="rm-editor"></div>
  <div id="rm-savebar" class="hide"></div>
  <div id="rm-preview" class="hide">
    <div class="pv-bar"><div class="pv-tabs"><button class="active" data-pv="cli">PDF Cliente</button><button data-pv="int">Hoja interna</button></div><button class="pv-close" id="rm-pv-close">✕</button></div>
    <div class="pv-scroll"><div id="rm-pv-cli"></div><div id="rm-pv-int" class="hide"></div></div>
    <div class="pv-dl"><button id="rm-pv-download">⤓ Descargar PDF</button></div>
  </div>
</div>

<div id="embed" class="hide">
  <div class="embed-bar"><button id="embed-back">← Inicio</button><span class="t" id="embed-title"></span></div>
  <iframe id="embed-frame" title="módulo"></iframe>
</div>
<div class="toast" id="toast"></div>

<script>
  const SB_URL='https://yfuhacfhgyzkkalullsm.supabase.co';
  const SB_KEY='sb_publishable_a5nwd1UC6GAoH1FJ53u4Zw_KEy_10qx';
  const URL_PLANOS='../index.html';
  const URL_REMOD='../remodelaciones/index.html';
  let sb=null, userEmail='';
  let clientes=[], allQuotes=[], dashPeriod='mes', cliDetailId=undefined;
  try{ sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}}); }catch(e){ console.error(e); }

  const $=id=>document.getElementById(id);
  const fmt=n=>'RD$ '+Number(Math.round(n||0)).toLocaleString('en-US');
  const fmtShort=n=>{ n=Number(n)||0; if(n>=1e6) return 'RD$ '+(n/1e6).toFixed(2)+'M'; if(n>=1e3) return 'RD$ '+Math.round(n/1e3)+'K'; return 'RD$ '+Math.round(n); };
  const esc=s=>String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;');
  const esUSD=r=>(r.moneda||'').toUpperCase()==='USD';
  const toast=(m,err)=>{const t=$('toast');t.textContent=m;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',2200);};

  // ICONOS (estilo 2 redondeado, teal via currentColor/stroke)
  const IC={
    dash:'<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',
    cli:'<circle cx="9" cy="8" r="3.4"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.5"/><path d="M17.8 20a5 5 0 0 0-3-4.6"/>',
    cot:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/>',
    ajustes:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
    logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
    burger:'<path d="M4 6h16M4 12h16M4 18h16"/>',
    plus:'<path d="M12 5v14M5 12h14"/>'
  };
  const svg=(name,sz)=>'<svg viewBox="0 0 24 24"'+(sz?' style="width:'+sz+'px;height:'+sz+'px"':'')+'>'+IC[name]+'</svg>';

  // pintar íconos fijos
  $('burger').innerHTML=svg('burger');
  document.querySelector('[data-nav="dash"]').innerHTML=svg('dash')+'<span>Dashboard</span>';
  document.querySelector('[data-nav="cli"]').innerHTML=svg('cli')+'<span>Clientes</span>';
  document.querySelector('[data-nav="cot"]').innerHTML=svg('cot')+'<span>Cotizar</span>';
  document.querySelector('[data-nav="ajustes"]').innerHTML=svg('ajustes')+'<span>Ajustes</span>';
  $('dr-logout').innerHTML=svg('logout')+'<span>Cerrar sesión</span>';

  // ================= AUTH =================
  $('toggle-pass').addEventListener('click',()=>{const p=$('login-pass'),b=$('toggle-pass');const sh=p.type==='password';p.type=sh?'text':'password';b.textContent=sh?'🙈':'👁';});
  $('login-btn').addEventListener('click',()=>login());
  $('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
  const isNet=e=>{const m=((e&&(e.message||e.name))||'').toString().toLowerCase();return m.includes('load failed')||m.includes('fetch')||m.includes('network');};
  async function login(attempt){
    attempt=typeof attempt==='number'?attempt:0;
    if(!sb){$('login-msg').textContent='Sin conexión.';return;}
    const email=$('login-email').value.trim(), password=$('login-pass').value;
    if(!email||!password){$('login-msg').textContent='Escribe tu correo y contraseña.';return;}
    $('login-msg').textContent=attempt>0?'El servidor está despertando… ('+attempt+'/3)':'Entrando…';
    try{
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error){ if(isNet(error)&&attempt<3){setTimeout(()=>login(attempt+1),4000);return;} $('login-msg').textContent=isNet(error)?'Sin conexión; espera ~30s.':'Error: '+error.message; return; }
      onLogin(data.session);
    }catch(e){ if(isNet(e)&&attempt<3){setTimeout(()=>login(attempt+1),4000);return;} $('login-msg').textContent='No se pudo conectar.'; }
  }
  function onLogin(session){
    userEmail=session.user.email||'';
    try{localStorage.setItem('laios_email',userEmail);}catch(e){}
    $('login-pass').value='';
    $('login').classList.add('hide'); $('app').classList.remove('hide');
    const nm=userEmail.split('@')[0];
    $('dr-name').textContent=nm; $('dr-av').textContent=(nm[0]||'?').toUpperCase();
    cargarTodo(); navegar('dash');
  }
  $('dr-logout').addEventListener('click',async()=>{ await sb.auth.signOut(); location.reload(); });
  async function checkSession(){
    if(!sb) return;
    const {data}=await sb.auth.getSession();
    if(data&&data.session) onLogin(data.session);
    else { try{const em=localStorage.getItem('laios_email'); if(em)$('login-email').value=em;}catch(e){} }
  }

  // ================= DRAWER / NAV =================
  const drawer=$('drawer'), ov=$('dr-ov');
  const openDrawer=()=>{drawer.classList.add('open');ov.classList.add('open');};
  const closeDrawer=()=>{drawer.classList.remove('open');ov.classList.remove('open');};
  $('burger').addEventListener('click',openDrawer);
  ov.addEventListener('click',closeDrawer);
  drawer.addEventListener('click',e=>{ const it=e.target.closest('.dr-item'); if(!it||!it.dataset.nav) return; navegar(it.dataset.nav); closeDrawer(); });
  const TITULOS={dash:'Dashboard',cli:'Clientes',cot:'Cotizar',ajustes:'Ajustes'};
  function navegar(w){
    ['dash','cli','cot','ajustes'].forEach(v=>$('v-'+v).classList.toggle('hide',v!==w));
    drawer.querySelectorAll('.dr-item[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===w));
    $('pagettl').textContent=TITULOS[w]||'';
    if(w==='dash') renderDash();
    else if(w==='cli') renderClientes();
    else if(w==='cot') renderCotizar();
    window.scrollTo(0,0);
  }

  // ================= DATOS =================
  async function cargarTodo(){
    try{
      const [cl,pc,rc]=await Promise.all([
        sb.from('clientes').select('id,nombre,contacto,rnc').order('nombre'),
        sb.from('cotizaciones').select('id,numero,cliente_id,cliente_nombre,proyecto,estado,moneda,total,created_at').order('created_at',{ascending:false}),
        sb.from('remodelaciones').select('id,numero,cliente_id,cliente_nombre,proyecto,estado,moneda,total,created_at').order('created_at',{ascending:false})
      ]);
      clientes=cl.data||[];
      const planos=(pc.data||[]).map(r=>({...r,tipo:'planos'}));
      const remod=(rc.data||[]).map(r=>({...r,tipo:'remod'}));
      allQuotes=[...planos,...remod].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
      renderDash();
    }catch(e){ console.error(e); }
  }
  const inPeriod=(dstr,p)=>{
    if(p==='todo') return true;
    const d=dstr?new Date(dstr):null; if(!d) return false; const now=new Date();
    if(p==='semana'){ const diff=(now-d)/86400000; return diff>=0&&diff<=7; }
    if(p==='mes') return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
    if(p==='ano') return d.getFullYear()===now.getFullYear();
    return true;
  };
  const sumDop=arr=>arr.filter(r=>!esUSD(r)).reduce((s,r)=>s+(Number(r.total)||0),0);
  const sumUsd=arr=>arr.filter(r=>esUSD(r)).reduce((s,r)=>s+(Number(r.total)||0),0);

  // ================= DASHBOARD =================
  function renderDash(){
    const rows=allQuotes.filter(r=>inPeriod(r.created_at,dashPeriod));
    const planos=rows.filter(r=>r.tipo==='planos'), remod=rows.filter(r=>r.tipo==='remod');
    const totDop=sumDop(rows), totUsd=sumUsd(rows);
    // chart: últimos 6 meses (DOP, ambos)
    const now=new Date(), meses=[];
    for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); meses.push({y:d.getFullYear(),m:d.getMonth(),lbl:d.toLocaleDateString('es-DO',{month:'short'})}); }
    const vals=meses.map(mm=>sumDop(allQuotes.filter(r=>{const d=r.created_at?new Date(r.created_at):null;return d&&d.getFullYear()===mm.y&&d.getMonth()===mm.m;})));
    const max=Math.max(...vals,1);
    const barsHTML=meses.map((mm,i)=>'<div class="bcol"><div class="bar'+(i===5?' gold':'')+'" style="height:'+Math.max(2,Math.round(vals[i]/max*100))+'%"></div><div class="bl">'+mm.lbl+'</div></div>').join('');
    const recientes=rows.slice(0,8).map(r=>{
      const est=r.estado||'borrador';
      return '<div class="rrow"><span class="badge '+r.tipo+'">'+(r.tipo==='planos'?'Planos':'Remod')+'</span><div class="m"><div class="n">'+esc(r.cliente_nombre||r.proyecto||'—')+'</div><div class="s">'+esc(r.numero||'—')+' · '+est+'</div></div><div class="amt">'+(esUSD(r)?'US$ ':'RD$ ')+Number(Math.round(r.total||0)).toLocaleString('en-US')+'</div></div>';
    }).join('') || '<div class="empty">Sin cotizaciones en este período.</div>';
    const P=[['semana','Semana'],['mes','Mes'],['ano','Año'],['todo','Todo']];
    $('v-dash').innerHTML=
      '<div class="h1-row"><div class="h1">Dashboard</div></div>'+
      '<div class="segs">'+P.map(x=>'<button data-p="'+x[0]+'" class="'+(dashPeriod===x[0]?'active':'')+'">'+x[1]+'</button>').join('')+'</div>'+
      '<div class="kpi-hero"><div class="l">Total cotizado</div><div class="v">'+fmt(totDop)+'</div>'+(totUsd>0?'<div class="usd">+ US$ '+Number(Math.round(totUsd)).toLocaleString('en-US')+'</div>':'')+'</div>'+
      '<div class="kpi2"><div class="kpi"><div class="l">Planos / Diseño</div><div class="v">'+fmtShort(sumDop(planos))+'</div><div class="c">'+planos.length+' cotización(es)</div></div><div class="kpi"><div class="l">Remodelación</div><div class="v">'+fmtShort(sumDop(remod))+'</div><div class="c">'+remod.length+' cotización(es)</div></div></div>'+
      '<div class="chart"><div class="t">Cotizado por mes · últimos 6</div><div class="bars">'+barsHTML+'</div></div>'+
      '<div class="sec-h">Actividad reciente</div>'+recientes;
  }
  $('v-dash').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b&&b.dataset.p){ dashPeriod=b.dataset.p; renderDash(); } });

  // ================= CLIENTES =================
  function contarCot(cid){ return allQuotes.filter(q=>q.cliente_id===cid).length; }
  function renderClientes(){
    cliDetailId=undefined;
    const lista=clientes.length? clientes.map(c=>{
      const n=contarCot(c.id);
      return '<div class="cli" data-cli="'+c.id+'"><div class="av">'+esc((c.nombre||'?')[0].toUpperCase())+'</div><div class="m"><div class="n">'+esc(c.nombre)+'</div><div class="s">'+n+' cotización(es)'+(c.rnc?' · RNC '+esc(c.rnc):'')+'</div></div></div>';
    }).join('') : '<div class="empty">Aún no tienes clientes. Toca "+ Nuevo".</div>';
    $('v-cli').innerHTML='<div class="h1-row"><div class="h1">Clientes</div><button class="newbtn" id="cli-new">+ Nuevo</button></div><div id="cli-body">'+lista+'</div>';
  }
  function formCliente(c){
    cliDetailId=c?c.id:null;
    $('v-cli').innerHTML='<div class="h1-row"><div class="h1">'+(c?'Editar':'Nuevo')+' cliente</div><button class="newbtn" id="cli-volver" style="background:#eae6da;color:var(--ink)">← Volver</button></div>'+
      '<div class="cli-card"><div class="cli-title">'+(c?'Editar cliente':'Nuevo cliente')+'</div>'+
      '<div class="field"><label>Nombre</label><input id="c-nombre" value="'+esc(c?c.nombre:'')+'"></div>'+
      '<div class="field"><label>Contacto</label><input id="c-contacto" value="'+esc(c?c.contacto:'')+'"></div>'+
      '<div class="field"><label>RNC / Cédula</label><input id="c-rnc" value="'+esc(c?c.rnc:'')+'"></div>'+
      '<button class="save-cli" id="c-save">'+(c?'Guardar cambios':'Crear cliente')+'</button></div>';
  }
  $('v-cli').addEventListener('click',e=>{
    if(e.target.id==='cli-new'){ formCliente(null); return; }
    if(e.target.id==='cli-volver'){ renderClientes(); return; }
    if(e.target.id==='c-save'){ guardarCliente(); return; }
    const c=e.target.closest('[data-cli]'); if(c){ const cl=clientes.find(x=>x.id===c.dataset.cli); if(cl) formCliente(cl); }
  });
  async function guardarCliente(){
    const datos={nombre:$('c-nombre').value.trim(),contacto:$('c-contacto').value.trim()||null,rnc:$('c-rnc').value.trim()||null};
    if(!datos.nombre){ toast('El nombre no puede estar vacío',true); return; }
    try{
      if(cliDetailId){ const {error}=await sb.from('clientes').update(datos).eq('id',cliDetailId); if(error){toast('Error al guardar',true);return;} const c=clientes.find(x=>x.id===cliDetailId); if(c)Object.assign(c,datos); toast('Cliente actualizado'); }
      else { const {data,error}=await sb.from('clientes').insert(datos).select().single(); if(error){toast('Error al crear',true);return;} clientes.push(data); clientes.sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'')); toast('Cliente creado'); }
      renderClientes();
    }catch(e){ toast('Error de conexión',true); }
  }

  // ================= COTIZAR =================
  function renderCotizar(){
    const recientes=allQuotes.slice(0,6).map(r=>{
      const est=r.estado||'borrador';
      return '<div class="rrow" data-openrow data-tipo="'+r.tipo+'" data-rid="'+(r.id||'')+'"><span class="badge '+r.tipo+'">'+(r.tipo==='planos'?'Planos':'Remod')+'</span><div class="m"><div class="n">'+esc(r.cliente_nombre||r.proyecto||'—')+'</div><div class="s">'+esc(r.numero||'—')+' · '+est+'</div></div><div class="amt">'+(esUSD(r)?'US$ ':'RD$ ')+Number(Math.round(r.total||0)).toLocaleString('en-US')+'</div></div>';
    }).join('') || '<div class="empty">Aún no hay cotizaciones.</div>';
    $('v-cot').innerHTML='<div class="h1-row"><div class="h1">Cotizar</div></div>'+
      '<div class="cot-cards">'+
        '<div class="cot-card" data-go="planos"><div class="ic">'+svg('cot',24)+'</div><div class="t"><div class="n">Nueva de planos</div><div class="d">Honorarios de diseño y arquitectura</div></div></div>'+
        '<div class="cot-card rem" data-go="remod"><div class="ic">'+svg('cot',24)+'</div><div class="t"><div class="n">Nueva remodelación</div><div class="d">Levantamiento por espacios y partidas</div></div></div>'+
        '<div class="cot-card soon" data-go="construccion"><div class="ic">'+svg('cot',24)+'</div><div class="t"><div class="n">Nueva construcción <span class="soon-tag">Próximamente</span></div><div class="d">Presupuesto de obra por partidas</div></div></div>'+
      '</div>'+
      '<div class="sec-h">Últimas cotizaciones</div>'+recientes;
  }
  $('v-cot').addEventListener('click',e=>{
    const card=e.target.closest('[data-go]'); if(card){ const go=card.dataset.go; if(go==='remod') RemodMod.nuevo(); else if(go==='construccion') toast('Construcción — próximamente'); else abrirModulo('planos'); return; }
    const row=e.target.closest('[data-openrow]'); if(row){ const tipo=row.dataset.tipo, rid=row.dataset.rid; if(tipo==='remod'&&rid) RemodMod.abrir(rid); else abrirModulo('planos', rid||null); }
  });

  // ================= EMBED (temporal, hasta fusión 2b/2c) =================
  function abrirModulo(go,id){
    $('embed-title').textContent = go==='planos'?'Planos / Diseño':'Remodelación';
    let u = go==='planos'?URL_PLANOS:URL_REMOD;
    u += '?embed=1'+(id?('&open='+encodeURIComponent(id)):'&nuevo=1');
    $('embed-frame').src = u;
    $('embed').classList.remove('hide');
  }
  $('embed-back').addEventListener('click',()=>{ $('embed').classList.add('hide'); $('embed-frame').src='about:blank'; cargarTodo(); });

  // ================= MÓDULO REMODELACIÓN (fusionado, sin iframe) =================
  const RemodMod=(function(){
    const UNI=['m²','und','ml','glb','día'];
    const $$=id=>document.getElementById(id);
    const fmtN=n=>Number(Math.round(n||0)).toLocaleString('en-US');
    let cur=null, curId=null, pvTab='cli';

    const itSub=it=> it.pa?(Number(it.monto)||0):(Number(it.cant)||0)*(Number(it.costo)||0);
    const acapTot=a=>a.items.reduce((s,it)=>s+itSub(it),0);
    const partTot=p=>p.acapites.reduce((s,a)=>s+acapTot(a),0);
    const espTot=e=>e.partidas.reduce((s,p)=>s+partTot(p),0);
    const costosTot=()=>cur.espacios.reduce((s,e)=>s+espTot(e),0);
    const honMonto=()=> cur.hon.tipo==='pa'?(Number(cur.hon.monto)||0):costosTot()*(Number(cur.hon.pct)||0)/100;
    const baseTot=()=>costosTot()+honMonto();
    const itbisMonto=()=> cur.itbis?baseTot()*0.18:0;
    const totalFinal=()=>baseTot()+itbisMonto();

    const nuevoItem=()=>({concepto:'',pa:false,cant:'',uni:'m²',costo:'',monto:''});
    const nuevoAcap=()=>({nombre:'',items:[nuevoItem()]});
    const nuevaPart=()=>({nombre:'',desc:'',acapites:[nuevoAcap()]});
    const nuevoEsp=()=>({nombre:'',partidas:[nuevaPart()]});
    const nuevaCot=()=>({cliente_id:null,cliente_nombre:'',proyecto:'',numero:'',estado:'borrador',moneda:'DOP',itbis:false,hon:{tipo:'pct',pct:15,monto:0},espacios:[nuevoEsp()]});

    function volver(){ $$('remod-screen').classList.add('hide'); $$('rm-savebar').classList.add('hide'); $$('rm-preview').classList.add('hide'); cargarTodo(); }
    function nuevo(){ cur=nuevaCot(); curId=null; $$('remod-screen').classList.remove('hide'); renderEditor(); $$('rm-editor').scrollTop=0; }
    async function abrir(id){
      try{
        const {data,error}=await sb.from('remodelaciones').select('*').eq('id',id).single();
        if(error||!data){ toast('No se pudo abrir',true); return; }
        cur=data.data||nuevaCot();
        cur.cliente_id=data.cliente_id; cur.cliente_nombre=data.cliente_nombre; cur.proyecto=data.proyecto;
        cur.numero=data.numero; cur.estado=data.estado; cur.moneda=data.moneda||'DOP'; cur.itbis=!!data.itbis;
        cur.hon=cur.hon||{tipo:data.honorario_tipo||'pct',pct:15,monto:0};
        curId=id; $$('remod-screen').classList.remove('hide'); renderEditor(); $$('rm-editor').scrollTop=0;
      }catch(e){ toast('Error de conexión',true); }
    }

    function renderEditor(){
      const cliOpts='<option value="">— Selecciona cliente —</option>'+clientes.map(c=>'<option value="'+c.id+'" '+(c.id===cur.cliente_id?'selected':'')+'>'+esc(c.nombre)+'</option>').join('');
      const meta='<div class="ed-meta"><label>Cliente</label><select id="m-cli">'+cliOpts+'</select><label>Proyecto / lugar</label><input id="m-proy" value="'+esc(cur.proyecto)+'" placeholder="Ej. Apto. Torre Sol"></div>';
      const espHTML=cur.espacios.map((esp,ei)=>{
        const parts=esp.partidas.map((p,pi)=>{
          const acaps=p.acapites.map((a,ai)=>{
            const items=a.items.map((it,ii)=>{
              const P=ei+':'+pi+':'+ai+':'+ii;
              const modes='<div class="it-mode"><button class="'+(!it.pa?'active':'')+'" data-mode="mult:'+P+'">× precio</button><button class="'+(it.pa?'active':'')+'" data-mode="pa:'+P+'">PA</button></div>';
              const det= it.pa
                ? '<div class="nums"><div class="nb pa"><small>Monto total (PA)</small><input inputmode="decimal" value="'+(it.monto==null?'':it.monto)+'" data-k="monto" data-e="'+ei+'" data-p="'+pi+'" data-a="'+ai+'" data-i="'+ii+'"></div><div class="subb"><small>Subt.</small><b>'+fmtN(itSub(it))+'</b></div><button class="lx" data-del="item:'+P+'">✕</button></div>'
                : '<div class="nums"><div class="nb qty"><small>Cant.</small><input inputmode="decimal" value="'+(it.cant==null?'':it.cant)+'" data-k="cant" data-e="'+ei+'" data-p="'+pi+'" data-a="'+ai+'" data-i="'+ii+'"></div><div class="ub"><small>Und</small><select data-k="uni" data-e="'+ei+'" data-p="'+pi+'" data-a="'+ai+'" data-i="'+ii+'">'+UNI.map(u=>'<option '+(u===it.uni?'selected':'')+'>'+u+'</option>').join('')+'</select></div><div class="times">×</div><div class="nb cost"><small>Costo</small><input inputmode="decimal" value="'+(it.costo==null?'':it.costo)+'" data-k="costo" data-e="'+ei+'" data-p="'+pi+'" data-a="'+ai+'" data-i="'+ii+'"></div><div class="subb"><small>Subt.</small><b>'+fmtN(itSub(it))+'</b></div><button class="lx" data-del="item:'+P+'">✕</button></div>';
              return '<div class="linea"><div class="it-top"><input class="concepto" placeholder="Ítem" value="'+esc(it.concepto)+'" data-k="concepto" data-e="'+ei+'" data-p="'+pi+'" data-a="'+ai+'" data-i="'+ii+'">'+modes+'</div>'+det+'</div>';
            }).join('');
            return '<div class="acapite"><div class="acap-head"><input class="acap-name" placeholder="Acápite" value="'+esc(a.nombre)+'" data-k="anombre" data-e="'+ei+'" data-p="'+pi+'" data-a="'+ai+'"><button class="x-btn" data-del="acap:'+ei+':'+pi+':'+ai+'">✕</button></div>'+items+'<div class="acap-foot"><button class="mini-btn" data-add="item:'+ei+':'+pi+':'+ai+'">+ Ítem</button><div class="acap-sub">Acápite: <b>'+fmt(acapTot(a))+'</b></div></div></div>';
          }).join('');
          return '<div class="partida"><div class="part-head"><input class="part-name" placeholder="Partida" value="'+esc(p.nombre)+'" data-k="pnombre" data-e="'+ei+'" data-p="'+pi+'"><button class="x-btn" data-del="part:'+ei+':'+pi+'">✕</button></div><div class="pd-lbl">Descripción (va en el PDF del cliente)</div><textarea class="part-desc" data-k="pdesc" data-e="'+ei+'" data-p="'+pi+'" placeholder="Qué se hará en esta partida...">'+esc(p.desc)+'</textarea>'+acaps+'<button class="add-row" data-add="acap:'+ei+':'+pi+'">+ Acápite</button><div class="part-sub">Subtotal partida: <b>'+fmt(partTot(p))+'</b></div></div>';
        }).join('');
        return '<div class="espacio"><div class="esp-head"><div class="esp-icon">▦</div><input class="esp-name" placeholder="Espacio (baño, cocina...)" value="'+esc(esp.nombre)+'" data-k="enombre" data-e="'+ei+'"><button class="x-btn" data-del="esp:'+ei+'">✕</button></div>'+parts+'<button class="add-row" data-add="part:'+ei+'">+ Partida</button><div class="esp-sub">Subtotal espacio: <b>'+fmt(espTot(esp))+'</b></div></div>';
      }).join('');
      const h=cur.hon;
      const honHTML='<div class="opt-card"><div class="opt-h">Honorario profesional</div><div class="seg"><button class="'+(h.tipo==='pct'?'active':'')+'" data-hon="pct">Porcentaje</button><button class="'+(h.tipo==='pa'?'active':'')+'" data-hon="pa">Monto (PA)</button></div><div class="opt-row"><div class="opt-in">'+(h.tipo==='pct'?'<input inputmode="decimal" value="'+h.pct+'" data-k="honpct"><span class="u">% sobre costos</span>':'<span class="u">RD$</span><input inputmode="decimal" value="'+(h.monto||'')+'" data-k="honmonto" style="width:120px">')+'</div><div class="opt-amt">'+fmt(honMonto())+'</div></div></div>';
      const itbisHTML='<div class="opt-card"><div class="opt-h">Impuestos</div><div class="opt-row"><label class="switch"><input type="checkbox" id="chk-itbis" '+(cur.itbis?'checked':'')+'> Aplicar ITBIS (18%)</label><div class="opt-amt">'+fmt(itbisMonto())+'</div></div></div>';
      $$('rm-editor').innerHTML=meta+espHTML+'<button class="add-esp" id="rm-add-esp"><span class="g">+</span> Agregar espacio</button>'+honHTML+itbisHTML;
      $$('rm-title').textContent = cur.numero ? ('Remodelación · '+cur.numero) : 'Nueva remodelación';
      barra();
    }
    function barra(){ const b=$$('rm-savebar'); b.innerHTML='<div class="sb-inner"><div class="sb-total"><div class="l">Total al cliente</div><div class="v">'+fmt(totalFinal())+'</div></div><div class="sb-acts"><button class="b-prev" id="rm-btn-prev">Ver PDF</button><button class="b-save" id="rm-btn-save">Guardar</button></div></div>'; b.classList.remove('hide'); }
    function refresh(){
      $$('rm-editor').querySelectorAll('.espacio').forEach((ec,ei)=>{
        let esub=0;
        ec.querySelectorAll('.partida').forEach((pc,pi)=>{ let psub=0;
          pc.querySelectorAll('.acapite').forEach((ac,ai)=>{ let asub=0;
            ac.querySelectorAll('.linea').forEach((lc,ii)=>{ const s=itSub(cur.espacios[ei].partidas[pi].acapites[ai].items[ii]); asub+=s; const b=lc.querySelector('.subb b'); if(b)b.textContent=fmtN(s); });
            psub+=asub; const b=ac.querySelector('.acap-sub b'); if(b)b.textContent=fmt(asub);
          });
          esub+=psub; const b=pc.querySelector('.part-sub b'); if(b)b.textContent=fmt(psub);
        });
        const b=ec.querySelector('.esp-sub b'); if(b)b.textContent=fmt(esub);
      });
      const amts=$$('rm-editor').querySelectorAll('.opt-amt');
      if(amts[0])amts[0].textContent=fmt(honMonto()); if(amts[1])amts[1].textContent=fmt(itbisMonto());
      barra();
    }

    // eventos editor
    const ED=$$('rm-editor');
    ED.addEventListener('input',e=>{
      const t=e.target, k=t.dataset.k;
      if(t.id==='m-proy'){ cur.proyecto=t.value; return; }
      if(k==null) return;
      if(k==='honpct'){ cur.hon.pct=t.value; refresh(); return; }
      if(k==='honmonto'){ cur.hon.monto=t.value; refresh(); return; }
      const ei=+t.dataset.e;
      if(k==='enombre'){ cur.espacios[ei].nombre=t.value; return; }
      const pi=+t.dataset.p, p=cur.espacios[ei].partidas[pi];
      if(k==='pnombre'){ p.nombre=t.value; return; }
      if(k==='pdesc'){ p.desc=t.value; return; }
      const ai=+t.dataset.a;
      if(k==='anombre'){ p.acapites[ai].nombre=t.value; return; }
      const ii=+t.dataset.i, it=p.acapites[ai].items[ii];
      if(k==='concepto'){ it.concepto=t.value; return; }
      if(k==='cant'){ it.cant=t.value; refresh(); return; }
      if(k==='costo'){ it.costo=t.value; refresh(); return; }
      if(k==='monto'){ it.monto=t.value; refresh(); return; }
    });
    ED.addEventListener('change',e=>{
      const t=e.target;
      if(t.id==='m-cli'){ const c=clientes.find(x=>x.id===t.value); cur.cliente_id=t.value||null; cur.cliente_nombre=c?c.nombre:''; return; }
      if(t.id==='chk-itbis'){ cur.itbis=t.checked; refresh(); return; }
      if(t.dataset.k==='uni'){ cur.espacios[+t.dataset.e].partidas[+t.dataset.p].acapites[+t.dataset.a].items[+t.dataset.i].uni=t.value; }
    });
    ED.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      if(b.id==='rm-add-esp'){ cur.espacios.push(nuevoEsp()); renderEditor(); return; }
      const mode=b.dataset.mode, add=b.dataset.add, del=b.dataset.del, hon=b.dataset.hon;
      if(hon){ cur.hon.tipo=hon; renderEditor(); return; }
      if(mode){ const a=mode.split(':'); const it=cur.espacios[+a[1]].partidas[+a[2]].acapites[+a[3]].items[+a[4]]; if(a[0]==='pa'){ if(it.monto===''||it.monto==null) it.monto=itSub(it)||''; it.pa=true; } else it.pa=false; renderEditor(); return; }
      if(add){ const a=add.split(':'), tt=a[0], e0=+a[1];
        if(tt==='part') cur.espacios[e0].partidas.push(nuevaPart());
        else if(tt==='acap') cur.espacios[e0].partidas[+a[2]].acapites.push(nuevoAcap());
        else if(tt==='item') cur.espacios[e0].partidas[+a[2]].acapites[+a[3]].items.push(nuevoItem());
        renderEditor(); return; }
      if(del){ const a=del.split(':'), tt=a[0], e0=+a[1];
        if(tt==='esp'){ if(confirm('¿Borrar espacio?')) cur.espacios.splice(e0,1); }
        else if(tt==='part'){ if(confirm('¿Borrar partida?')) cur.espacios[e0].partidas.splice(+a[2],1); }
        else if(tt==='acap'){ if(confirm('¿Borrar acápite?')) cur.espacios[e0].partidas[+a[2]].acapites.splice(+a[3],1); }
        else if(tt==='item'){ cur.espacios[e0].partidas[+a[2]].acapites[+a[3]].items.splice(+a[4],1); }
        renderEditor(); return; }
    });

    // savebar + back
    $$('rm-back').addEventListener('click',volver);
    $$('rm-savebar').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; if(b.id==='rm-btn-save')guardar(); else if(b.id==='rm-btn-prev')abrirPreview(); });

    async function guardar(){
      const btn=$$('rm-btn-save'); if(btn){btn.textContent='Guardando…';btn.disabled=true;}
      try{
        if(!cur.numero){ const {count}=await sb.from('remodelaciones').select('id',{count:'exact',head:true}); cur.numero='REM-'+String((count||0)+1).padStart(4,'0'); }
        const row={ numero:cur.numero, cliente_id:cur.cliente_id, cliente_nombre:cur.cliente_nombre, proyecto:cur.proyecto, estado:cur.estado, moneda:cur.moneda, itbis:cur.itbis, honorario_tipo:cur.hon.tipo, honorario_valor:cur.hon.tipo==='pct'?Number(cur.hon.pct)||0:Number(cur.hon.monto)||0, costos:costosTot(), total:totalFinal(), data:cur };
        let res;
        if(curId) res=await sb.from('remodelaciones').update(row).eq('id',curId).select('id').single();
        else res=await sb.from('remodelaciones').insert(row).select('id').single();
        if(res.error){ toast('Error al guardar',true); } else { curId=res.data.id; $$('rm-title').textContent='Remodelación · '+cur.numero; toast('Guardada ('+cur.numero+')'); }
      }catch(e){ toast('Error de conexión',true); }
      finally{ const b2=$$('rm-btn-save'); if(b2){b2.textContent='Guardar';b2.disabled=false;} }
    }

    // preview + pdf
    const fechaHoy=()=>new Date().toLocaleDateString('es-DO',{day:'2-digit',month:'short',year:'numeric'});
    function abrirPreview(){ pvTab='cli'; renderPreview(); $$('rm-preview').classList.remove('hide'); }
    $$('rm-pv-close').addEventListener('click',()=>$$('rm-preview').classList.add('hide'));
    document.querySelector('#rm-preview .pv-tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; pvTab=b.dataset.pv; [...e.currentTarget.children].forEach(x=>x.classList.toggle('active',x===b)); $$('rm-pv-cli').classList.toggle('hide',pvTab!=='cli'); $$('rm-pv-int').classList.toggle('hide',pvTab!=='int'); });
    function renderPreview(){
      const espCli=cur.espacios.map(e=>{ const descs=e.partidas.map(p=>p.desc&&p.desc.trim()?p.desc.trim():'').filter(Boolean).join(' '); return '<div class="cl-esp"><div class="cl-top"><div class="cl-name">'+esc(e.nombre||'Espacio')+'</div><div class="cl-amt">'+fmt(espTot(e))+'</div></div>'+(descs?'<div class="cl-desc">'+esc(descs)+'</div>':'')+'</div>'; }).join('');
      const costos=costosTot(),hon=honMonto(),itb=itbisMonto(),total=totalFinal(),subCliente=costos+hon;
      $$('rm-pv-cli').innerHTML='<div class="sheet" id="rm-sheet-cli"><div class="sh-brand"><span class="g">Laios</span> Group</div><div class="sh-tag">Arquitectura · Diseño · Construcción</div><div class="sh-meta"><div><div class="l">Cliente</div><div class="v">'+esc(cur.cliente_nombre||'—')+'</div><div class="l" style="margin-top:8px">Proyecto</div><div class="v">'+esc(cur.proyecto||'—')+'</div></div><div style="text-align:right"><div class="sh-doc">Cotización</div><div class="v" style="margin-top:8px">'+esc(cur.numero||'—')+'</div><div class="v">'+fechaHoy()+'</div></div></div>'+espCli+'<div class="sh-tot"><div class="sh-tr"><span>Subtotal</span><span>'+fmt(subCliente)+'</span></div>'+(cur.itbis?'<div class="sh-tr"><span>ITBIS (18%)</span><span>'+fmt(itb)+'</span></div>':'')+'<div class="sh-tr big"><span>Total</span><span class="tot-v">'+fmt(total)+'</span></div></div><div class="sh-note">Cotización sujeta a levantamiento en sitio. Válida por 15 días.</div></div>';
      const espInt=cur.espacios.map(e=>{ const parts=e.partidas.map(p=>{ const acaps=p.acapites.map(a=>{ const items=a.items.map(it=> it.pa?'<div class="in-item"><span class="d">'+esc(it.concepto||'—')+' <span class="pa-tag">PA</span></span><span class="q">precio alzado</span><span class="s">'+fmtN(itSub(it))+'</span></div>':'<div class="in-item"><span class="d">'+esc(it.concepto||'—')+'</span><span class="q">'+(Number(it.cant)||0)+' '+it.uni+' × '+fmtN(it.costo)+'</span><span class="s">'+fmtN(itSub(it))+'</span></div>').join(''); return '<div class="in-acap">'+esc(a.nombre||'—')+'</div>'+items; }).join(''); return '<div class="in-part">'+esc(p.nombre||'—')+'</div>'+acaps; }).join(''); return '<div class="in-esp"><div class="in-esp-h"><span>'+esc(e.nombre||'Espacio')+'</span><span class="t">'+fmt(espTot(e))+'</span></div>'+parts+'</div>'; }).join('');
      const map={}, paList=[];
      cur.espacios.forEach(e=>{ const en=e.nombre||'Espacio'; e.partidas.forEach(p=>p.acapites.forEach(a=>a.items.forEach(it=>{ if(it.pa){ if(itSub(it)>0) paList.push({c:it.concepto||'—',e:en,m:itSub(it)}); return; } const cant=Number(it.cant)||0; if(!cant) return; const key=(it.concepto||'—').trim().toLowerCase()+'|'+it.uni; if(!map[key]) map[key]={c:it.concepto||'—',u:it.uni,total:0,porEsp:{}}; map[key].total+=cant; map[key].porEsp[en]=(map[key].porEsp[en]||0)+cant; }))); });
      const shopRows=Object.values(map).map(m=>{ const bd=Object.entries(m.porEsp).map(([en,q])=>fmtN(q)+' '+en).join(' + '); return '<div class="shop-item"><div class="d">'+esc(m.c)+'<div class="b">'+esc(bd)+'</div></div><div class="s">'+fmtN(m.total)+' '+m.u+'</div></div>'; }).join('');
      const paRows=paList.map(x=>'<div class="shop-item"><div class="d">'+esc(x.c)+' <span class="pa-tag">PA</span><div class="b">'+esc(x.e)+'</div></div><div class="s">'+fmt(x.m)+'</div></div>').join('');
      const shopHTML='<div class="shop"><div class="shop-h">Lista de compra consolidada</div>'+(shopRows||'<div class="in-item">Sin materiales por cantidad.</div>')+(paRows?'<div class="in-acap" style="margin-top:8px">Precios alzados</div>'+paRows:'')+'</div>';
      $$('rm-pv-int').innerHTML='<div class="sheet" id="rm-sheet-int"><div class="sh-brand"><span class="g">Laios</span> <span style="color:var(--ink)">·</span> interno</div><div class="sh-tag">Hoja de compra y presupuesto</div><div class="sh-meta"><div><div class="l">Proyecto</div><div class="v">'+esc(cur.proyecto||'—')+'</div></div><div style="text-align:right"><div class="sh-doc">'+esc(cur.numero||'—')+'</div><div class="v" style="margin-top:8px">'+fechaHoy()+'</div></div></div>'+espInt+'<div class="sh-tot"><div class="sh-tr big"><span>Costo total (sin honorario)</span><span class="tot-v">'+fmt(costos)+'</span></div></div>'+shopHTML+'<div class="sh-note">Tu tope de compra. Las cantidades ya están sumadas por material y por espacio.</div></div>';
    }
    $$('rm-pv-download').addEventListener('click',async()=>{
      const src= pvTab==='cli' ? $$('rm-sheet-cli') : $$('rm-sheet-int'); if(!src){ toast('Nada que exportar',true); return; }
      const nombre=(pvTab==='cli'?'Cotizacion_':'HojaInterna_')+(cur.numero||'remod')+'.pdf';
      const btn=$$('rm-pv-download'); btn.textContent='Generando…'; btn.disabled=true;
      const holder=document.createElement('div'); holder.style.cssText='position:fixed;left:-10000px;top:0;width:760px;background:#fff;';
      const clone=src.cloneNode(true); clone.style.boxShadow='none'; clone.style.borderRadius='0'; clone.style.margin='0';
      holder.appendChild(clone); document.body.appendChild(holder);
      try{ if(document.fonts&&document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} } await new Promise(r=>setTimeout(r,120));
        await html2pdf().set({margin:8,filename:nombre,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:760},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(clone).save();
      }catch(err){ toast('Error al generar PDF',true); }
      finally{ document.body.removeChild(holder); btn.textContent='⤓ Descargar PDF'; btn.disabled=false; }
    });

    return {nuevo, abrir};
  })();

  checkSession();
</script>
